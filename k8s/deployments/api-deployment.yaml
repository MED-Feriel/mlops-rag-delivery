# Déploiement de l'API RAG (FastAPI, port 8080).
#
# Particularité : le modèle d'embedding (~470 Mo) n'est PAS dans l'image (il est
# monté via ./models en local). Un initContainer le télécharge donc dans un
# volume partagé AVANT le démarrage du conteneur principal, qui le charge ensuite
# en mode offline (HF_HUB_OFFLINE=1). Pour un cluster air-gapped : remplacer le
# téléchargement par un modèle baké dans l'image, ou un PVC RWX pré-rempli.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: rag-livraison
  labels:
    app: rag-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rag-api
  template:
    metadata:
      labels:
        app: rag-api
    spec:
      # fsGroup=1000 : le volume "models" devient accessible en écriture à
      # l'utilisateur applicatif (apiuser, uid 1000) pour y déposer le modèle.
      securityContext:
        fsGroup: 1000
      # Requis seulement si le package GHCR est privé (voir README).
      imagePullSecrets:
        - name: ghcr-secret
      initContainers:
        # Pré-télécharge le modèle d'embedding dans le volume partagé.
        - name: embedding-model-downloader
          image: ghcr.io/med-feriel/mlops-rag-delivery/api:latest
          command: ["python", "-c"]
          args:
            - |
              import os
              from huggingface_hub import snapshot_download
              dst = "/app/models/paraphrase-multilingual-MiniLM-L12-v2"
              if os.path.exists(os.path.join(dst, "model.safetensors")):
                  print("modèle déjà présent:", dst)
              else:
                  print("téléchargement du modèle d'embedding...")
                  snapshot_download(
                      "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2",
                      local_dir=dst,
                  )
                  print("modèle prêt:", dst)
          env:
            # L'initContainer DOIT être en ligne (override du ConfigMap offline).
            - name: HF_HUB_OFFLINE
              value: "0"
            - name: TRANSFORMERS_OFFLINE
              value: "0"
          volumeMounts:
            - name: models
              mountPath: /app/models
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
      containers:
        - name: api
          image: ghcr.io/med-feriel/mlops-rag-delivery/api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          # Toute la config vient du ConfigMap + Secret (zéro valeur en dur).
          envFrom:
            - configMapRef:
                name: rag-config
            - secretRef:
                name: rag-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          # Readiness : le pod ne reçoit du trafic qu'une fois /health répondant.
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          # Liveness : redémarre le conteneur si /health ne répond plus.
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: models
              mountPath: /app/models
              readOnly: true
      volumes:
        # emptyDir : rempli par l'initContainer, partagé avec le conteneur API.
        # Chaque pod re-télécharge (coût au scale). Pour mutualiser : PVC RWX.
        - name: models
          emptyDir:
            sizeLimit: 1Gi
