# ExternalSecret — ESO matérialise un Secret k8s "rag-secrets" à partir des
# valeurs lues dans Vault (chemins secret/rag/*). Remplace le secrets.yaml
# statique : les secrets ne vivent plus dans le cluster en dur, ESO les
# synchronise et les rafraîchit (refreshInterval).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: rag-secrets
  namespace: rag-livraison
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: rag-secrets        # Secret k8s produit (consommé par les Deployments)
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: rag/postgres
        property: password
    - secretKey: JWT_SECRET
      remoteRef:
        key: rag/jwt
        property: secret
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        key: rag/admin
        property: password
    - secretKey: API_SERVICE_TOKEN
      remoteRef:
        key: rag/service
        property: token
