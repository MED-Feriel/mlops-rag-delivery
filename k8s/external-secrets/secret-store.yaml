# SecretStore — connecte External Secrets Operator (ESO) à Vault.
# Prérequis : ESO installé dans le cluster + un Secret "vault-token" contenant
# un token Vault (clé "token") dans le namespace rag-livraison.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: rag-livraison
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"          # mount KV v2
      version: "v2"
      auth:
        tokenSecretRef:
          name: vault-token
          key: token
