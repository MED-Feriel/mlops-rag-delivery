# Autoscaling horizontal de l'API RAG selon la charge CPU.
# Nécessite metrics-server dans le cluster (kubectl top doit fonctionner).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-hpa
  namespace: rag-livraison
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # Scale-up quand l'usage CPU moyen dépasse 70% des *requests*.
          averageUtilization: 70
