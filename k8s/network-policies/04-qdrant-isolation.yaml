# Qdrant : ingress UNIQUEMENT depuis l'API, sur 6333. Aucun egress (hors DNS) →
# la base vectorielle est isolée (ni accès externe, ni appels sortants).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qdrant-isolation
  namespace: rag-livraison
spec:
  podSelector:
    matchLabels:
      app: qdrant
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: rag-api
      ports:
        - protocol: TCP
          port: 6333
