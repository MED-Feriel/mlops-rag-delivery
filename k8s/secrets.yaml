# TEMPLATE de Secret — NE PAS committer de vraies valeurs.
# Les valeurs sont volontairement VIDES : à remplir manuellement, OU (mieux)
# créer le Secret hors-Git via kubectl (voir README, section "Secrets").
#
# stringData : on saisit en clair, Kubernetes encode en base64 à l'admission.
apiVersion: v1
kind: Secret
metadata:
  name: rag-secrets
  namespace: rag-livraison
type: Opaque
stringData:
  # Mot de passe PostgreSQL (si Postgres est déployé séparément).
  POSTGRES_PASSWORD: ""
  # Secret de signature des JWT — OBLIGATOIRE si AUTH_ENABLED=true.
  # Générer p.ex. : openssl rand -hex 32
  JWT_SECRET: ""
  # Mot de passe du compte applicatif (login /auth/token).
  AUTH_PASSWORD: ""
  # Jeton service-à-service (ex: utilisé par Open WebUI). Vide = désactivé.
  API_SERVICE_TOKEN: ""
