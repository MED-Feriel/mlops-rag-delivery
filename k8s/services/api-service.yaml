# Service de l'API RAG. ClusterIP : exposition externe gérée par l'Ingress.
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: rag-livraison
  labels:
    app: rag-api
spec:
  type: ClusterIP
  selector:
    app: rag-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
