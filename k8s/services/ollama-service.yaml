# Service Ollama. Le nom "ollama" correspond à OLLAMA_HOST du ConfigMap.
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: rag-livraison
  labels:
    app: ollama
spec:
  type: ClusterIP
  selector:
    app: ollama
  ports:
    - name: http
      port: 11434
      targetPort: 11434
