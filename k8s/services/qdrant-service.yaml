# Service Qdrant. Le nom "qdrant" correspond à QDRANT_HOST du ConfigMap →
# l'API le résout en qdrant.rag-livraison.svc.cluster.local sur le port 6333.
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: rag-livraison
  labels:
    app: qdrant
spec:
  type: ClusterIP
  selector:
    app: qdrant
  ports:
    - name: http
      port: 6333
      targetPort: 6333
    - name: grpc
      port: 6334
      targetPort: 6334
